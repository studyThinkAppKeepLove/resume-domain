<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>受邀访问</title>
  <style>
    :root { color-scheme: dark; background: #0b1013; color: #e6eff0; font: 16px/1.7 system-ui, sans-serif; }

    h1 { margin: 0; font-size: 1.45rem; line-height: 1.35; }
    p { margin: 9px 0 0; color: #a9bcc0; }
  </style>
</head>
<body>
  <main>
    <h1>受邀访问</h1>
    <p id="status" role="status">请使用对方发给你的完整访问链接。</p>
    <noscript><p>请在启用 JavaScript 的浏览器中打开链接。</p></noscript>
  </main>
  <script type="module" src="./unlock.js"></script>
</body>
</html>
